<!DOCTYPE html>
<html lang="pt-BR">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Aula 6 — DOM e funções</title>
        <link rel="stylesheet" href="bungas.css">
        <script src="bligs.js" defer></script>
</head>
<body>
        <main class="lesson-card">
                <p class="eyebrow">Aula 06 • JavaScript</p>
                <h1>DOM, entradas e funções</h1>

                <section>
                        <h2>Capturando um texto</h2>
                        <label for="text">Escreva algo</label>
                        <div class="lesson-controls">
                                <input type="text" id="text">
                                <button type="button" id="print-text">Mostrar texto</button>
                        </div>
                        <p id="spanito" aria-live="polite">O texto aparecerá aqui.</p>
                </section>

                <section>
                        <h2>Tipos de input</h2>
                        <div class="input-examples">
                                <label>Texto <input type="text" aria-label="Exemplo de texto"></label>
                                <label>Número <input type="number" aria-label="Exemplo de número"></label>
                                <label>Senha <input type="password" aria-label="Exemplo de senha"></label>
                                <label>Data <input type="date" aria-label="Exemplo de data"></label>
                                <label class="check-label"><input type="checkbox"> Marcar opção</label>
                        </div>
                </section>

                <section>
                        <h2>Exercício 1 — ano de nascimento</h2>
                        <label for="ex1_nome">Nome</label>
                        <input type="text" id="ex1_nome">
                        <label for="ex1_idade">Idade</label>
                        <input type="number" id="ex1_idade" min="0" max="130">
                        <button type="button" id="run-ex1">Calcular</button>
                        <p id="r1" aria-live="polite"></p>
                </section>

                <section>
                        <h2>Exercício 2 — contagem</h2>
                        <label for="ex2_num">Conte de zero até</label>
                        <input type="number" id="ex2_num" min="0" max="100">
                        <button type="button" id="run-ex2">Contar</button>
                        <p id="r2" aria-live="polite"></p>
                </section>

                <a href="../index.html">Voltar ao portfólio</a>
        </main>
</body>
</html>
